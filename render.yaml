services:
  - type: web
    name: california-fruit-sq-verifier
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn sqr_verifier_v2.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: VISION_PROVIDER
        value: anthropic
      - key: ANTHROPIC_MODEL
        value: claude-3-5-haiku-20241022
      - key: MAX_UPLOAD_MB
        value: "150"
      - key: SQR_DATA_DIR
        value: /tmp/sqr-verifier
