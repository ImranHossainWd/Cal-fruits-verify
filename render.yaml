services:
  - type: web
    name: california-fruit-sq-verifier
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: VISION_PROVIDER
        value: anthropic
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-20250514
      - key: MAX_UPLOAD_MB
        value: "150"
      - key: SQR_DATA_DIR
        value: /tmp/sqr-verifier
